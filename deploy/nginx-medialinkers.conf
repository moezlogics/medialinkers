# Nginx site for www.medialinkers.pk → Next.js on 127.0.0.1:3113
# Copy to /etc/nginx/sites-available/medialinkers, enable it, then run certbot (see DEPLOY.md).
# certbot adds the "listen 443 ssl" lines and certificates automatically.

# medialinkers.pk (no www) → https://www.medialinkers.pk
server {
    listen 80;
    listen [::]:80;
    server_name medialinkers.pk;
    return 301 https://www.medialinkers.pk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.medialinkers.pk;

    # Media uploads from the admin panel
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # Hashed build files never change: cache for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3113;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3113;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
